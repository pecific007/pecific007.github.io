<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github-dark-dimmed.min.css">
        <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
        <script>hljs.highlightAll();</script>
        <link rel="stylesheet" href="/ide/ide.css" />
        <title>Source Code</title>
    </head>
    <body>
        <main class="content">
            <nav class="explorer" id="fileExplorer">
                <div class="explorer-label">
                    <div class="tag">Explorer</div>
                    <div class="more">···</div>
                </div>
            </nav>
            <div class="hero-area">
                <div class="tabs-container">
                    <button class="tab">🖹 index.html <span class="close-tab-button" style="font-size: 1.2em">&times;</span></button>
                    <button class="tab">🖹 index.css <span class="close-tab-button" style="font-size: 1.2em">&times;</span></button>
                </div>
                <div class="editor">
                    <pre class="line-numbers" id="lineNumbers"></pre>
                    <div class="code">
                        <pre>
                            <code></code>
                        </pre>
                    </div>

                </div>
            </div>
        </main>
        <script type="module" src="file-list.js"></script>
        <script type="module" src="ide.js"></script>
    </body>
</html>
