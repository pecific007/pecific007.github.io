<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Socials</title>
    <link rel="icon" href="Images/icons/Logo.png" type="image/x-icon" />
    <link rel="stylesheet" href="style-socials.css">
    <link rel="stylesheet" href="style-general.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <nav class="navbar">
      <div class="webname">Pecific</div>
      <div class="nav">
        <ul class="ul" type="none">
          <a href="index.html">
            <li class="li">Programming</li>
          </a>
          <a href="art.html">
            <li class="li">Art</li>
          </a>
          <li class="high li">Socials</li>
        </ul>
        </ul>
      </div>
    </nav>

    <main class="main">
      <div class="content">

        <h1>Follow me on:</h1>

        <div class="card_container"></div>

    </main>

    <template id="card_template">
        <img src="" alt="" class="logo">
        <p>Visit:</p>
        <a href="" target="_blank">
            <button class="blue_button"></button>
        </a>
    </template>

    <nav class="btmbar">
      <a href="index.html">
      <span class="li" title="Programming">
        <img class="btbr_img" src="Images/icons/programming-svgrepo-com.svg" alt="">
      </span>
      </a>
      <a href="art.html">
        <span class="li" title="Art">
          <img class="btbr_img" src="Images/icons/art-palette-svgrepo-com.svg" alt="">
        </span>
      </a>
        <span class="raiseup high li" title="Socials">
          <img class="btbr_img" src="Images/icons/social-youtube-svgrepo-com.svg" alt="">
        </span>
    </nav>

    <script>
      const container = document.querySelector('.card_container');
      const template = document.querySelector("#card_template");
      // All links to display:
      const icons = {
        "Github": "https://github.com/pecific007",
        "YouTube": "https://youtube.com/@prash_rathod007",
        "Instagram": "https://www.instagram.com/endframe_art/",
        "MonkeyType": "https://monkeytype.com/profile/Pecific007",
        "Sketchfab": "https://sketchfab.com/Minute_watchers_64"
      }

      // List of keys:
      let paths = Object.keys(icons);

      for (let i = 0; i < paths.length; i++) {
        el = document.createElement('label');
        el.classList.add('card')
        el.innerHTML = template.innerHTML;
        img = el.querySelector('img');
        img.src = `Images/icons/${paths[i]}.svg`;
        img.alt = `Logo: ${paths[i]}`;
          if (paths[i] == "MonkeyType") {
            img.style.width = "6rem";
            img.style.paddingInline = ".5rem";
          }
        btn = el.querySelector('button');
        btn.textContent = paths[i];
        link = el.querySelector('a');
        link.href = icons[paths[i]];
        container.appendChild(el);
      }
    </script>

  </body>
</html>
